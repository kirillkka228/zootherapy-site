<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оголошення та допомога — Зоотерапія</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Зоотерапія Дніпро</div>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="clinics.html">Клініки</a></li>
                <li><a href="events.html">Заходи</a></li>
                <li><a href="contacts.html" class="active">Оголошення та допомога</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Подати оголошення</h2>
            <p>Загубили улюбленця, знайшли тварину чи шукаєте їй домівку у Дніпрі та області? Заповніть форму нижче:</p>
            
            <form id="announcementForm">
                <div class="form-group">
                    <label for="title">Заголовок оголошення:</label>
                    <input type="text" id="title" required placeholder="напр., Загубився собака (Бігль)">
                </div>

                <div class="form-group">
                    <label for="category">Категорія оголошення:</label>
                    <select id="category" required>
                        <option value="Загублено">Загублено тварину</option>
                        <option value="Знайдено">Знайдено тварину</option>
                        <option value="Шукає домівку">Шукає домівку / Прилаштування</option>
                        <option value="Потрібна допомога">Потрібна допомога / Перетримування</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="district">Місто / Район Дніпра:</label>
                    <input type="text" id="district" required placeholder="напр., м. Дніпро, Соборний район">
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефону для зв'язку:</label>
                    <input type="tel" id="phone" required placeholder="+380XXXXXXXXX">
                </div>

                <div class="form-group">
                    <label for="description">Детальний опис:</label>
                    <textarea id="description" rows="4" required placeholder="Опишіть зовнішність, особливі прикмети, наявність нашийника, умови тощо..."></textarea>
                </div>

                <button type="submit" class="btn">Опублікувати оголошення</button>
            </form>
            <div id="formStatus"></div>
        </section>

        <section class="announcements-section">
            <h2>Актуальні оголошення Дніпропетровщини</h2>
            <div id="announcementsList" class="cards-grid">
            </div>
        </section>
    </main>

    <script>
        async function loadAnnouncements() {
            try {
                const response = await fetch('/api/announcements');
                const announcements = await response.json();
                const container = document.getElementById('announcementsList');
                container.innerHTML = '';

                if (announcements.length === 0) {
                    container.innerHTML = '<p>Наразі немає активних оголошень.</p>';
                    return;
                }

                announcements.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card announcement-card';
                    card.innerHTML = `
                        <span class="badge ${getBadgeClass(item.category)}">${item.category}</span>
                        <h3>${item.title}</h3>
                        <p><strong>Локація:</strong> ${item.district}</p>
                        <p><strong>Контакт:</strong> <a href="tel:${item.phone}">${item.phone}</a></p>
                        <p>${item.description}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Помилка завантаження оголошень:', err);
            }
        }

        function getBadgeClass(category) {
            if (category === 'Загублено') return 'badge-danger';
            if (category === 'Знайдено') return 'badge-warning';
            return 'badge-info';
        }

        document.getElementById('announcementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('formStatus');

            const data = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                district: document.getElementById('district').value,
                phone: document.getElementById('phone').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/api/announcements', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    statusDiv.innerHTML = '<p class="success-msg">Оголошення опубліковано!</p>';
                    document.getElementById('announcementForm').reset();
                    loadAnnouncements();
                } else {
                    statusDiv.innerHTML = '<p class="error-msg"> Помилка при публікації.</p>';
                }
            } catch (err) {
                statusDiv.innerHTML = '<p class="error-msg">Помилка з"єднання з сервером.</p>';
            }
        });

        // Завантажити оголошення при відкритті сторінки
        loadAnnouncements();
    </script>
</body>
</html>
