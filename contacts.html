<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти — Зоотерапія</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Зоотерапія & Тварини</h1>
        <nav>
            <a href="index.html">Головна</a> | 
            <a href="clinics.html">Каталог клінік</a> | 
            <a href="events.html">Заходи</a> | 
            <a href="contacts.html">Контакти</a>
        </nav>
    </header>

    <main>
        <h2>Зворотний зв'язок</h2>
        <p class="subtitle">Маєте запитання або хочете запропонувати співпрацю? Напишіть нам!</p>

        <form id="contactForm" class="custom-form">
            <details class="add-clinic-block">
            <summary>➕ Додати нову клініку в каталог</summary>
            <form id="addClinicForm" class="custom-form">
                <div class="form-group">
                    <label>Назва закладу:</label>
                    <input type="text" id="cl-name" required>
                </div>
                <div class="form-group">
                    <label>Місто:</label>
                    <input type="text" id="cl-city" required>
                </div>
                <div class="form-group">
                    <label>Адреса:</label>
                    <input type="text" id="cl-address" required>
                </div>
                <div class="form-group">
                    <label>Телефон:</label>
                    <input type="text" id="cl-phone" placeholder="+380...">
                </div>
                <div class="form-group">
                    <label>Вид зоотерапії:</label>
                    <select id="cl-type">
                        <option value="Каністерапія">Каністерапія</option>
                        <option value="Іпотерапія">Іпотерапія</option>
                        <option value="Фелінотерапія">Фелінотерапія</option>
                        <option value="Комплексна зоотерапія">Комплексна зоотерапія</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Опис:</label>
                    <textarea id="cl-desc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-submit">Зберегти в базу</button>
            </form>
        </details>
            <div class="form-group">
                <label for="c-name">Ваше ім'я:</label>
                <input type="text" id="c-name" required placeholder="Олександр">
            </div>
            <div class="form-group">
                <label for="c-email">Ваш Email:</label>
                <input type="email" id="c-email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label for="c-message">Повідомлення:</label>
                <textarea id="c-message" rows="4" required placeholder="Текст вашого повідомлення..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Надіслати</button>
            <p id="formResponse" class="form-status"></p>
        </form>
    </main>
    <script src="script.js"></script>

    <footer>
        <p>&copy; 2026 Випускна робота. Всі права захищені.</p>
    </footer>

</body>
</html>
