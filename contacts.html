<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оголошення та допомога — Зоотерапія Дніпро</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стилі для карток оголошень */
        .announcements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .announcement-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .announcement-badge {
            align-self: flex-start;
            background-color: #ff8c00;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .announcement-title {
            margin: 0 0 10px 0;
            color: #1b5e20;
            font-size: 1.2em;
        }

        .announcement-info {
            font-size: 0.95em;
            color: #444;
            margin-bottom: 8px;
        }

        .announcement-desc {
            font-size: 0.9em;
            color: #666;
            line-height: 1.4;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }

        .announcement-phone {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 16px;
            background-color: #ff8c00;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }

        .announcement-phone:hover {
            background-color: #e07b00;
        }

        /* Стилі для шапки сайту */
        header nav ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        header nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        header nav ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Зоотерапія & Тварини</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="clinics.html">Каталог клінік</a></li>
                <li><a href="events.html">Заходи</a></li>
                <li><a href="contacts.html">Оголошення та допомога</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Подати оголошення</h2>
            <p>Загубили улюбленця, знайшли тварину чи шукаєте їй домівку у Дніпрі та області? Заповніть форму нижче:</p>
            
            <form id="announcementForm">
                <div class="form-group">
                    <label for="title">Заголовок оголошення:</label>
                    <input type="text" id="title" required placeholder="Заголовок оголошення">
                </div>

                <div class="form-group">
                    <label for="category">Категорія оголошення:</label>
                    <select id="category" required>
                        <option value="Загублено тварину">Загублено тварину</option>
                        <option value="Знайдено тварину">Знайдено тварину</option>
                        <option value="Шукає домівку">Шукає домівку</option>
                        <option value="Потрібна допомога">Потрібна допомога</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="district">Місто / Район Дніпра:</label>
                    <input type="text" id="district" required placeholder="Локація або район">
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефону для зв'язку:</label>
                    <input type="tel" id="phone" required placeholder="+380XXXXXXXXX">
                </div>

                <div class="form-group">
                    <label for="description">Детальний опис:</label>
                    <textarea id="description" rows="4" required placeholder="Опишіть зовнішність, особливі прикмети, умови тощо..."></textarea>
                </div>

                <button type="submit" class="btn">Опублікувати оголошення</button>
            </form>
            <div id="statusMessage" class="status-msg"></div>
        </section>

        <section class="list-section">
            <h2>Актуальні оголошення Дніпропетровщини</h2>
            <div id="announcementsList" class="announcements-grid">
                <!-- Картки оголошень будуть завантажуватись сюди -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Випускна робота. Всі права захищені.</p>
    </footer>

    <script>
        // Завантаження оголошень
        async function loadAnnouncements() {
            try {
                const response = await fetch('/api/announcements');
                const announcements = await response.json();
                
                const list = document.getElementById('announcementsList');
                list.innerHTML = '';

                if (announcements.length === 0) {
                    list.innerHTML = '<p>Поки немає опублікованих оголошень.</p>';
                    return;
                }

                announcements.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'announcement-card';
                    card.innerHTML = `
                        <div>
                            <span class="announcement-badge">${item.category}</span>
                            <h3 class="announcement-title">${item.title}</h3>
                            <div class="announcement-info"><strong>Локація:</strong> ${item.district}</div>
                            <div class="announcement-desc">${item.description}</div>
                        </div>
                        <a href="tel:${item.phone}" class="announcement-phone">Зателефонувати: ${item.phone}</a>
                    `;
                    list.appendChild(card);
                });
            } catch (err) {
                console.error('Помилка завантаження оголошень:', err);
            }
        }

        // Відправка форми
        document.getElementById('announcementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                district: document.getElementById('district').value,
                phone: document.getElementById('phone').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/api/announcements', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                const statusMsg = document.getElementById('statusMessage');

                if (response.ok) {
                    statusMsg.style.color = 'green';
                    statusMsg.textContent = 'Оголошення успішно опубліковано!';
                    document.getElementById('announcementForm').reset();
                    loadAnnouncements(); // Оновлюємо список
                } else {
                    statusMsg.style.color = 'red';
                    statusMsg.textContent = result.error || 'Помилка при збереженні';
                }
            } catch (err) {
                console.error('Помилка:', err);
            }
        });

        // Завантажити оголошення при відкритті сторінки
        loadAnnouncements();
    </script>
</body>
</html>
